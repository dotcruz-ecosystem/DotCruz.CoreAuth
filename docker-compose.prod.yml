services:
  coreauth-api:
    image: ${DOCKER_IMAGE_TAG}
    container_name: dotcruz-coreauth-api
    restart: unless-stopped
    ports:
      - "5051:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgresqlConnection=${POSTGRES_CONNECTION_STRING}
      - ServiceId=${SERVICE_ID}
      - Settings__Notification__BaseUrl=${NOTIFICATION_BASE_URL}
      - Settings__Notification__ApiKey=${DOT_CRUZ_API_KEY}
      - Settings__JwtTokenSettings__ExpirationTimeMinutes=${JWT_EXPIRATION_MINUTES}
      - Settings__JwtTokenSettings__RefreshTokenExpirationTimeDays=${JWT_REFRESH_EXPIRATION_DAYS}
      - Settings__JwtTokenSettings__SigningKey=${JWT_SIGNING_KEY}
      - Settings__PasswordResetTokenSettings__ExpirationTimeInMinutes=${PASSWORD_RESET_EXPIRATION_MINUTES}
    networks:
      - dotcruz_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  dotcruz_net:
    name: dotcruz_net
    external: true
